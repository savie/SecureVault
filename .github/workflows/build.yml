name: Build SecureVault APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # Tambahan '-Pandroid.aapt2FromMavenOverride=' untuk MENIMPA/MENGOSONGKAN baris AAPT2 dari gradle.properties
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.aapt2FromMavenOverride=

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
